name: Validate Installs

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools.json'
      - 'scripts/test_clients.ts'
      - 'scripts/diff_tools.ts'
      - '.github/workflows/validate_installs.yml'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Optional Git base ref; leave empty to test the full catalog'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: installs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun package store
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('scripts/**/*.ts') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Validate catalog
        id: catalog
        run: bun run scripts/checks.ts 2>&1 | tee validation.log

      - name: Test tool installations
        id: installs
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MANUAL_BASE: ${{ inputs.base_ref }}
          HUSKY: '0'
        run: |
          args=(--all)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            args=(--diff "$PR_BASE")
          elif [ -n "$MANUAL_BASE" ]; then
            base=$(git rev-parse --verify --end-of-options "$MANUAL_BASE^{commit}")
            args=(--diff "$base")
          fi
          bun run scripts/test_clients.ts "${args[@]}" --output output.log 2>&1 | tee install.log

      - name: Summarize install validation
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CATALOG_STATUS: ${{ steps.catalog.outcome }}
          INSTALLS_STATUS: ${{ steps.installs.outcome }}
        run: python3 scripts/actions_summary.py installs

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-validation-failure
          path: |
            checks.log
            validation.log
            output.log
            install.log
          retention-days: 14
          if-no-files-found: ignore
