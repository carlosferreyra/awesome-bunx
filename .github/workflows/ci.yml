name: Catalog Validation and Tool Checks

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'tools.json'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - 'template/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'tools.json'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - 'template/**'
      - '.github/workflows/**'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun package store
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-tools-${{ hashFiles('tools.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-tools-
            ${{ runner.os }}-bun-

      - name: Validate tools.json schema
        run: bun run scripts/checks.ts

      - name: Test maintenance scripts
        run: bun test

      - name: Check README is up to date
        run: bun run scripts/readme.ts --check

      - name: Test tools via bunx
        # PR tool execution remains in validate_tool.yml.
        if: github.event_name != 'pull_request'
        id: test
        continue-on-error: true
        env:
          # Husky treats --help as a hook directory; prevent hook installation.
          HUSKY: '0'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            bun run scripts/test_clients.ts --diff HEAD~1 --output output.log
          else
            bun run scripts/test_clients.ts --all --output output.log
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: |
            checks.log
            output.log
          retention-days: 30

      - name: Fail job if any tools failed
        if: steps.test.outcome == 'failure'
        run: exit 1
